name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: write

jobs:
  build_fliiifenleger:
    name: Push Fliiifenleger image to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Set up JDK
        # Only needed for the versions:set step below (the image itself is
        # built inside the maven:3 Docker stage); runner Maven is used.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Derive release version from the tag
        # Tagged builds must embed the release version in the CLI jar's
        # --version output: the checked-out pom still carries the
        # *-SNAPSHOT development version (same expression as release.yml).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="${GITHUB_REF_NAME#v}" \
            -DgenerateBackupPoms=false
      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cmahnke/fliiifenleger/cli
          # latest=false: take full control — latest/snapshot below, no
          # automatic latest on default-branch pushes.
          flavor: |
            latest=false
          # v* tags: X.Y.Z, X.Y and latest. main: snapshot. PRs: build only
          # (push guard below), so their generated tags are unused.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=snapshot,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v7.3.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
