name: Maven release deploy

# Release workflow: triggered by version tags (v*).  It runs the full test
# suite, sets the Maven version from the tag, deploys the release artifacts
# to GitHub Packages, attaches the standalone JARs plus the Homebrew
# custom tarball to the GitHub release, builds GraalVM native binaries on
# Linux (amd64 + arm64 matrix) and attaches those too, and publishes the
# Homebrew formula to the cmahnke/homebrew-fliiifenleger tap via
# homebrew-releaser.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive release version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The jc2pa module compiles the c2pa Rust crate to wasm32-wasip1.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip1

      # Optional: enables the JXL image source tests in the core module.
      - name: Install JXL library
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6 libtcmalloc-minimal4 libgcc-s1 libc6 libhwy-dev libpng16-16 libbrotli1 libjpeg8 libgif7

          wget https://github.com/libjxl/libjxl/releases/download/v0.11.1/jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz
          tar xzf jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz

          sudo apt install -y -f ./libjxl_0.11.1_amd64.deb
          sudo apt install -y -f ./jxl_0.11.1_amd64.deb
          sudo apt install -y -f ./libjxl-dev_0.11.1_amd64.deb
          sudo apt-get -f install
          sudo find /usr/lib -name libjxl.so -print -exec ln -s {} /usr/lib/libjxl.so \;

      - name: Configure Maven server credentials for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Set Maven version from tag
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      # Release builds must pass the full test suite.
      - name: Run tests
        run: mvn --batch-mode verify

      # GitHub Packages is immutable for release versions — re-deploying the
      # same version returns 409 Conflict.  Remove any previously published
      # package versions of this release so re-running a release works.
      - name: Remove pre-existing package versions of this release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREFIX="de.christianmahnke.iiif.fliiifenleger"

          PACKAGES=$(gh api -H "Accept: application/vnd.github+json" \
              "/user/packages?package_type=maven" \
              --jq ".[] | select(.name | startswith(\"$PREFIX\")) | .name" 2>/dev/null || true)

          DELETED=0
          for PACKAGE in $PACKAGES; do
            IDS=$(gh api -H "Accept: application/vnd.github+json" \
                  "/user/packages/maven/$PACKAGE/versions" \
                  --jq ".[] | select(.name == \"$VERSION\") | .id" 2>/dev/null || true)
            for ID in $IDS; do
              echo "Deleting $PACKAGE $VERSION (id $ID)"
              gh api -X DELETE -H "Accept: application/vnd.github+json" \
                "/user/packages/maven/$PACKAGE/versions/$ID" && DELETED=$((DELETED + 1))
            done
          done
          echo "deleted $DELETED pre-existing package version(s)"
          # Version deletion propagates asynchronously — give the registry a
          # moment so the subsequent deploy does not race into a 409.
          if [ "$DELETED" -gt 0 ]; then sleep 15; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy release artifacts to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach standalone JARs to the GitHub release
        # Pushing a tag does not create a GitHub Release object — create it
        # if missing (with auto-generated notes), then attach the JARs.
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" --generate-notes --verify-tag \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" \
            cli/target/fliiifenleger-cli.jar \
            jc2pa/target/jc2pa-*-standalone.jar \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and attach Homebrew tarball
        # Custom tarball consumed by the homebrew job below via
        # homebrew-releaser's `custom_tarball` option: it must exist at
        # releases/download/<tag>/fliiifenleger.tar.gz before the formula
        # is generated (the action computes its checksum).  The bin/lib
        # layout matches packaging/homebrew/; the formula installs the JAR
        # into libexec and writes its own openjdk@21-pinned wrapper.
        run: |
          rm -rf homebrew-stage
          mkdir -p homebrew-stage/bin homebrew-stage/lib
          cp packaging/homebrew/fliiifenleger homebrew-stage/bin/
          cp cli/target/fliiifenleger-cli.jar homebrew-stage/lib/
          tar -czf fliiifenleger.tar.gz -C homebrew-stage bin lib
          gh release upload "${{ steps.version.outputs.tag }}" \
            fliiifenleger.tar.gz \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds GraalVM native binaries on Linux (amd64 + arm64, no
  # cross-compilation — each leg builds natively on its own runner).
  # macOS is covered by the JVM artifacts; there are no macOS legs
  # (native-image is same-OS only).  Runs in parallel with `release`;
  # each leg attaches its own asset (naming follows the
  # homebrew-releaser target_* convention for future use).
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive release version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM
        # Must stay on 25.3.x: the polyglot artifacts pin 25.3.4.1 and
        # builder/library skew fails the image build (TruffleLocator).
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          distribution: 'graalvm'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The jc2pa/jxl-wasm modules compile Rust crates to wasm32-wasip1.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip1

      # Enables the JXL image source tests in the core module.  The
      # amd64 debs below are arch-specific; arm64 uses the distro package.
      - name: Install JXL library (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6 libtcmalloc-minimal4 libgcc-s1 libc6 libhwy-dev libpng16-16 libbrotli1 libjpeg8 libgif7

          wget https://github.com/libjxl/libjxl/releases/download/v0.11.1/jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz
          tar xzf jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz

          sudo apt install -y -f ./libjxl_0.11.1_amd64.deb
          sudo apt install -y -f ./jxl_0.11.1_amd64.deb
          sudo apt install -y -f ./libjxl-dev_0.11.1_amd64.deb
          sudo apt-get -f install
          sudo find /usr/lib -name libjxl.so -print -exec ln -s {} /usr/lib/libjxl.so \;

      - name: Install JXL library (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjxl-dev
          sudo find /usr/lib -name 'libjxl.so*' -print
          test -e /usr/lib/aarch64-linux-gnu/libjxl.so \
            || sudo ln -s "$(sudo find /usr/lib -name 'libjxl.so.*' | head -1)" \
                          /usr/lib/aarch64-linux-gnu/libjxl.so

      - name: Configure Maven server credentials for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Set Maven version from tag
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      # Full test suite on the JVM, then the native binary.  Must NOT
      # deploy to GitHub Packages (the release job owns the versioned
      # deploy; a second deploy would 409).
      - name: Build and test native binary
        run: mvn --batch-mode -Pnative verify

      - name: Smoke-test the native binary
        run: |
          ./cli/target/fliiifenleger --version
          ./cli/target/fliiifenleger generate -s jxl \
            -o ./smoke-jxl jxl-wasm/src/test/resources/images/small.jxl
          test -f ./smoke-jxl/info.json

      - name: Attach native binary to the GitHub release
        # The release object is created by the release job (or here if
        # this leg wins the race) — create-if-missing, then attach.
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" --generate-notes --verify-tag \
            || gh release view "$TAG" > /dev/null
          tar -czf "fliiifenleger-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -C cli/target fliiifenleger
          gh release upload "$TAG" \
            "fliiifenleger-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the just-released version to the Homebrew tap.  Runs after
  # the release job so fliiifenleger.tar.gz is already attached.
  #
  # One-time setup (not in this repo):
  #   1. Create the tap repo cmahnke/homebrew-fliiifenleger with a Formula/
  #      directory (plus LICENSE and README).
  #   2. Create a classic PAT with `repo` scope covering both this repo and
  #      the tap, and save it as the HOMEBREW_TAP_TOKEN secret (the default
  #      GITHUB_TOKEN cannot push across repos).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Release project to Homebrew tap
        uses: Justintime50/homebrew-releaser@v4.0.0
        with:
          homebrew_owner: cmahnke
          homebrew_tap: homebrew-fliiifenleger
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: homebrew-releaser
          commit_email: homebrew-releaser@example.com
          # The tarball ships lib/fliiifenleger-cli.jar; install it into
          # libexec and write a wrapper pinned to openjdk@21 that keeps the
          # --enable-native-access flag (needed by the JXL imageio plugin).
          install: |
            libexec.install "lib/fliiifenleger-cli.jar"
            (bin/"fliiifenleger").write <<~EOS
              #!/bin/bash
              exec "#{Formula["openjdk@21"].opt_bin}/java" "--enable-native-access=ALL-UNNAMED" "-jar" "#{libexec}/fliiifenleger-cli.jar" "$@"
            EOS
          test: assert_match("fliiifenleger", shell_output("#{bin}/fliiifenleger --version"))
          # openjdk@21 matches the bytecode target (release 21); jpeg-xl
          # enables the `jxl` image source without extra user setup.
          depends_on: |
            "openjdk@21"
            "jpeg-xl"
          custom_tarball: fliiifenleger
          update_readme_table: false
          skip_commit: false
          debug: false
