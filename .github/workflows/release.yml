name: Maven release deploy

# Release workflow: triggered by version tags (v*).  It runs the full test
# suite, sets the Maven version from the tag, deploys the release artifacts
# to GitHub Packages, and attaches the standalone JARs to the GitHub release.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive release version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # The jc2pa module compiles the c2pa Rust crate to wasm32-wasip1.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1

      # Optional: enables the JXL image source tests in the core module.
      - name: Install JXL library
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6 libtcmalloc-minimal4 libgcc-s1 libc6 libhwy-dev libpng16-16 libbrotli1 libjpeg8 libgif7

          wget https://github.com/libjxl/libjxl/releases/download/v0.11.1/jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz
          tar xzf jxl-debs-amd64-ubuntu-24.04-v0.11.1.tar.gz

          sudo apt install -y -f ./libjxl_0.11.1_amd64.deb
          sudo apt install -y -f ./jxl_0.11.1_amd64.deb
          sudo apt install -y -f ./libjxl-dev_0.11.1_amd64.deb
          sudo apt-get -f install
          sudo find /usr/lib -name libjxl.so -print -exec ln -s {} /usr/lib/libjxl.so \;

      - name: Configure Maven server credentials for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Set Maven version from tag
        run: |
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      # Release builds must pass the full test suite.
      - name: Run tests
        run: mvn --batch-mode verify

      - name: Deploy release artifacts to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach standalone JARs to the GitHub release
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            cli/target/fliiifenleger-cli.jar \
            jc2pa/target/jc2pa-*-standalone.jar \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
