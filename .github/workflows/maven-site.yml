name: Publish Maven Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build site
        # The install step materialises the module artifacts (core, jc2pa,
        # cli) in the local repository first: the site goals do not compile
        # anything, so inter-module dependency resolution would otherwise
        # fail on a fresh runner.  The skips keep the site build free of
        # Rust toolchain requirements (the WASM module is not needed for
        # reporting).
        run: mvn -B install -DskipTests -Dmaven.cargo.skip=true -Dmaven.rustup.skip=true site site:stage

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # Default-locale render: the staged site (and all module
          # sub-sites) sit directly in the staging root.
          folder: target/staging
          clean: true
          single-commit: true
