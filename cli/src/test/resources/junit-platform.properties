# CLI tests stay sequential (conservative choice).
# Reasons: InfoCommand/RuntimeCommand tests capture System.out (not
# thread-safe), validate tests bind WireMock to dynamic ports and share
# process-global C2PA trust anchors, and WASM lane pools keep global
# state. Class-level parallelism is enabled only in core, where tiling
# is isolated per test (see core/src/test/resources/junit-platform.properties).
junit.jupiter.execution.parallel.enabled=false
