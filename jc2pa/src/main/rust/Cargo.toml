[package]
name    = "c2pa-wasm"
version = "0.1.0"
edition = "2021"

[lib]
name       = "c2pa_wasm"
crate-type = ["cdylib"]

[dependencies]
# Use standard table syntax to avoid TOML inline-table single-line restriction.
[dependencies.c2pa]
# Pinned to 0.90.x: 0.91.0 flips `verify.verify_after_sign` to true and
# restructures the trust settings schema (trust.anchors[]), which breaks the
# WASM signing path (manifests without an intent fail validation right after
# signing; the extra validation work also overflows the WASM stack, surfacing
# as nondeterministic Chicory traps). Adopting 0.91 requires setting a proper
# builder intent and migrating the trust-anchor settings — see TileSigner.
version          = "0.91.3"
default-features = false
features         = [
    "rust_native_crypto",
]

[dependencies.serde]
version  = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dev-dependencies]
base64 = "0.23"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true