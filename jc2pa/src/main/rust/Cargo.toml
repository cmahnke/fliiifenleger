[package]
name    = "c2pa-wasm"
version = "0.1.0"
edition = "2021"

[lib]
name       = "c2pa_wasm"
crate-type = ["cdylib"]

[dependencies]
# Use standard table syntax to avoid TOML inline-table single-line restriction.
[dependencies.c2pa]
# 0.91.0 flips `verify.verify_after_sign` to true; every sign re-validates the
# store in-process, and a manifest without a c2pa.created/c2pa.opened inception
# action fails that validation (assertion.action.malformed).  The wasm lib
# therefore installs a `create:empty` default builder intent (overridden by
# builder_set_intent or manifests carrying their own inception action) and
# migrated trust-anchor handling to the with_json legacy overlay, since
# Settings::with_value("trust.trust_anchors", ...) no longer reaches the
# trust validation in 0.91 (settings now use the trust.anchors[] schema).
# The extra in-sign validation also grows the required WASM stack below.
version          = "0.91.5"
default-features = false
features         = [
    "rust_native_crypto",
]

[dependencies.serde]
version  = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dev-dependencies]
base64 = "0.23"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true