[package]
name = "ultrahdr-wasm"
version = "0.1.0"
edition = "2021"

[lib]
name       = "ultrahdr_wasm"
crate-type = ["cdylib"]

[dependencies]
# Pure Rust Ultra HDR (JPEG with gain map) encoder/decoder.
[dependencies.ultrahdr-rs]
version = "0.3.5"
default-features = false

[dependencies.serde]
version  = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "1"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
